<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador de conversaciones</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e7e7e7;
    padding: 16px;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  p.sub { color: #9aa0a6; margin: 0 0 18px; font-size: 14px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  @media (min-width: 900px) { .grid { display: grid; grid-template-columns: 1fr 480px; gap: 28px; align-items: start; } }
  .card { background: #1a1d23; border: 1px solid #2a2e36; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .sides { display: flex; gap: 8px; margin-bottom: 12px; }
  .sides button { flex: 1; padding: 12px 10px; border-radius: 10px; border: 0; cursor: pointer; font-size: 14px; font-weight: 600; background: #2a2e36; color: #cfd2d6; -webkit-appearance: none; }
  .sides button.active { background: #e7e7e7; color: #15171c; }
  textarea { width: 100%; resize: vertical; border-radius: 10px; border: 1px solid #3a3f48; background: #0f1115; color: #fff; padding: 10px; font-size: 16px; font-family: inherit; }
  .btn { width: 100%; padding: 13px; border: 0; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 700; -webkit-appearance: none; }
  .btn-add { background: #4f7cff; color: #fff; margin-top: 8px; }
  .btn-dl { background: #19a974; color: #fff; }
  label.opt { display: block; font-size: 13px; color: #cfd2d6; margin-bottom: 12px; }
  input[type=file] { font-size: 12px; color: #cfd2d6; margin-top: 4px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.msg { display: flex; gap: 8px; align-items: flex-start; background: #0f1115; border: 1px solid #2a2e36; border-radius: 10px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
  .tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 5px; }
  .tag.l { background: #3a3f48; color: #fff; }
  .tag.r { background: #dfd6d1; color: #5b4a16; }
  .msg .txt { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .msg .ctrls { display: flex; gap: 2px; flex-shrink: 0; }
  .msg .ctrls button { background: none; border: 0; color: #9aa0a6; cursor: pointer; font-size: 16px; padding: 2px 5px; }
  .msg .ctrls button:disabled { opacity: .3; cursor: default; }
  .empty { color: #9aa0a6; font-size: 13px; }
  .preview-box { border-radius: 16px; overflow: hidden; }
  canvas { display: block; width: 100%; }
  .hint { text-align: center; font-size: 12px; color: #9aa0a6; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Simulador de conversaciones</h1>
  <p class="sub">Elige quién habla, escribe el mensaje y descarga la conversación con estilo DM de Instagram.</p>
  <div class="grid">
    <div>
      <div class="card">
        <div class="sides">
          <button type="button" id="sideLeft" class="active">⬅️ Izquierda (con foto)</button>
          <button type="button" id="sideRight">Derecha (tú) ➡️</button>
        </div>
        <textarea id="draft" rows="3" placeholder="Escribe el mensaje…  (Enter = salto de línea, Ctrl/Cmd+Enter = añadir)"></textarea>
        <button type="button" class="btn btn-add" id="addBtn">+ Añadir mensaje</button>
      </div>
      <div class="card">
        <label class="opt">Foto de perfil (lado izquierdo)<br><input type="file" id="avatarInput" accept="image/*" /></label>
        <label class="opt"><input type="checkbox" id="transparent" /> Fondo transparente (en vez de negro)</label>
      </div>
      <div class="card">
        <strong style="font-size:14px;">Mensajes</strong>
        <ul id="list" style="margin-top:10px;"></ul>
      </div>
    </div>
    <div>
      <div class="preview-box" id="previewBox" style="background:#000;">
        <canvas id="canvas"></canvas>
      </div>
      <button type="button" class="btn btn-dl" id="dlBtn" style="margin-top:14px;">⬇️ Descargar imagen (PNG)</button>
      <p class="hint">Se descarga exactamente lo que ves arriba.</p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var DEFAULT_AVATAR = "__AVATAR__";

  var W = 600, SCALE = 2, SIDE_PAD = 16, TOP_PAD = 22, BOTTOM_PAD = 22;
  var PAD_X = 15, PAD_Y = 11, RADIUS = 22, FONT_SIZE = 17, LINE_HEIGHT = 23;
  var AVATAR = 30, AVATAR_GAP = 9, GAP_NORMAL = 12, GAP_SAME = 3;
  var FONT = '17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  var COLORS = { bg:'#000000', rightBubble:'#dfd6d1', rightText:'#1c1c1e', leftBubble:'#202020', leftText:'#ffffff', avatarFallback:'#3a3a3c' };

  var messages = [
    { id:'a', side:'right', text:'Es malo sobre pensar?' },
    { id:'b', side:'left', text:'Si, cuando no filtras tus pensamientos.\n\nPero si aprendes a usar tu mente, la convertirás en tu superpoder.' },
    { id:'c', side:'right', text:'Mi superpoder?' },
    { id:'d', side:'left', text:'Claro.\nComo cuando descubres la página de trucos del GTA' }
  ];
  var side = 'left';
  var avatarImg = null;
  var idCounter = 0;
  function newId() { idCounter += 1; return 'm' + idCounter + '_' + Date.now(); }

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var draftEl = document.getElementById('draft');
  var transparentEl = document.getElementById('transparent');
  var listEl = document.getElementById('list');
  var sideLeftBtn = document.getElementById('sideLeft');
  var sideRightBtn = document.getElementById('sideRight');
  var previewBox = document.getElementById('previewBox');

  function loadAvatar(src) {
    var img = new Image();
    img.onload = function () { avatarImg = img; draw(); };
    img.onerror = function () { avatarImg = null; draw(); };
    img.src = src;
  }

  function setSide(s) {
    side = s;
    sideLeftBtn.classList.toggle('active', s === 'left');
    sideRightBtn.classList.toggle('active', s === 'right');
  }

  function wrapText(c, text, maxWidth) {
    var lines = [];
    var paras = text.split('\n');
    for (var pi = 0; pi < paras.length; pi++) {
      var para = paras[pi];
      if (para === '') { lines.push(''); continue; }
      var words = para.split(' ');
      var cur = '';
      for (var wi = 0; wi < words.length; wi++) {
        var word = words[wi];
        // Palabra mas larga que la burbuja: partir caracter a caracter
        if (c.measureText(word).width > maxWidth) {
          if (cur) { lines.push(cur); cur = ''; }
          var chunk = '';
          for (var ci = 0; ci < word.length; ci++) {
            var test = chunk + word[ci];
            if (c.measureText(test).width > maxWidth && chunk) { lines.push(chunk); chunk = word[ci]; }
            else { chunk = test; }
          }
          cur = chunk;
          continue;
        }
        var t = cur ? cur + ' ' + word : word;
        if (c.measureText(t).width > maxWidth && cur) { lines.push(cur); cur = word; }
        else { cur = t; }
      }
      lines.push(cur);
    }
    return lines;
  }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function draw() {
    var transparent = transparentEl.checked;
    previewBox.style.background = transparent
      ? 'repeating-conic-gradient(#e5e5e5 0% 25%, #ffffff 0% 50%) 50% / 20px 20px'
      : '#000';

    ctx.font = FONT; ctx.textBaseline = 'top';
    var maxBubble = W * 0.74;
    var maxTextWidth = maxBubble - PAD_X * 2;
    var leftIndent = SIDE_PAD + AVATAR + AVATAR_GAP;

    var laid = messages.map(function (msg, i) {
      var lines = wrapText(ctx, msg.text, maxTextWidth);
      var tw = 0;
      for (var li = 0; li < lines.length; li++) tw = Math.max(tw, ctx.measureText(lines[li]).width);
      var bw = Math.ceil(Math.min(maxBubble, tw + PAD_X * 2));
      var bh = lines.length * LINE_HEIGHT + PAD_Y * 2;
      var next = messages[i + 1];
      return { msg: msg, lines: lines, bw: bw, bh: bh, lastOfGroup: !next || next.side !== msg.side };
    });

    var totalH = TOP_PAD + BOTTOM_PAD;
    laid.forEach(function (l, i) {
      totalH += l.bh;
      if (i < laid.length - 1) totalH += laid[i + 1].msg.side === l.msg.side ? GAP_SAME : GAP_NORMAL;
    });
    totalH = Math.max(totalH, 200);

    canvas.width = W * SCALE;
    canvas.height = Math.ceil(totalH) * SCALE;
    ctx.scale(SCALE, SCALE);
    ctx.font = FONT; ctx.textBaseline = 'top';

    if (!transparent) { ctx.fillStyle = COLORS.bg; ctx.fillRect(0, 0, W, totalH); }
    else { ctx.clearRect(0, 0, W, totalH); }

    var y = TOP_PAD;
    laid.forEach(function (l, i) {
      var isLeft = l.msg.side === 'left';
      var x = isLeft ? leftIndent : W - SIDE_PAD - l.bw;

      ctx.fillStyle = isLeft ? COLORS.leftBubble : COLORS.rightBubble;
      roundRect(ctx, x, y, l.bw, l.bh, RADIUS);
      ctx.fill();

      ctx.fillStyle = isLeft ? COLORS.leftText : COLORS.rightText;
      l.lines.forEach(function (line, li) {
        ctx.fillText(line, x + PAD_X, y + PAD_Y + li * LINE_HEIGHT + (LINE_HEIGHT - FONT_SIZE) / 2);
      });

      if (isLeft && l.lastOfGroup) {
        var ay = y + l.bh - AVATAR;
        ctx.save();
        ctx.beginPath();
        ctx.arc(SIDE_PAD + AVATAR / 2, ay + AVATAR / 2, AVATAR / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        if (avatarImg) {
          var r = Math.max(AVATAR / avatarImg.width, AVATAR / avatarImg.height);
          var dw = avatarImg.width * r, dh = avatarImg.height * r;
          ctx.drawImage(avatarImg, SIDE_PAD + AVATAR / 2 - dw / 2, ay + AVATAR / 2 - dh / 2, dw, dh);
        } else {
          ctx.fillStyle = COLORS.avatarFallback;
          ctx.fillRect(SIDE_PAD, ay, AVATAR, AVATAR);
        }
        ctx.restore();
      }

      y += l.bh;
      if (i < laid.length - 1) y += laid[i + 1].msg.side === l.msg.side ? GAP_SAME : GAP_NORMAL;
    });

    renderList();
  }

  function renderList() {
    listEl.innerHTML = '';
    if (messages.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'Aún no hay mensajes. Añade el primero arriba.';
      listEl.appendChild(empty);
      return;
    }
    messages.forEach(function (m, i) {
      var li = document.createElement('li');
      li.className = 'msg';

      var tag = document.createElement('span');
      tag.className = 'tag ' + (m.side === 'left' ? 'l' : 'r');
      tag.textContent = m.side === 'left' ? 'Izq' : 'Der';

      var txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = m.text;

      var ctrls = document.createElement('span');
      ctrls.className = 'ctrls';
      var up = document.createElement('button'); up.type = 'button'; up.textContent = '↑'; up.disabled = i === 0;
      var down = document.createElement('button'); down.type = 'button'; down.textContent = '↓'; down.disabled = i === messages.length - 1;
      var del = document.createElement('button'); del.type = 'button'; del.textContent = '✕'; del.style.color = '#ff6b6b';
      up.addEventListener('click', function () { move(m.id, -1); });
      down.addEventListener('click', function () { move(m.id, 1); });
      del.addEventListener('click', function () { remove(m.id); });
      ctrls.appendChild(up); ctrls.appendChild(down); ctrls.appendChild(del);

      li.appendChild(tag); li.appendChild(txt); li.appendChild(ctrls);
      listEl.appendChild(li);
    });
  }

  function addMessage() {
    var t = draftEl.value.trim();
    if (!t) return;
    messages.push({ id: newId(), side: side, text: t });
    draftEl.value = '';
    draftEl.focus();
    draw();
  }
  function remove(id) { messages = messages.filter(function (m) { return m.id !== id; }); draw(); }
  function move(id, dir) {
    var i = -1;
    for (var k = 0; k < messages.length; k++) if (messages[k].id === id) { i = k; break; }
    var j = i + dir;
    if (i < 0 || j < 0 || j >= messages.length) return;
    var tmp = messages[i]; messages[i] = messages[j]; messages[j] = tmp;
    draw();
  }

  // ---- Eventos (enganchados por JS, no inline) ----
  sideLeftBtn.addEventListener('click', function () { setSide('left'); });
  sideRightBtn.addEventListener('click', function () { setSide('right'); });
  document.getElementById('addBtn').addEventListener('click', addMessage);
  document.getElementById('dlBtn').addEventListener('click', function () {
    var a = document.createElement('a');
    a.download = 'conversacion-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
  transparentEl.addEventListener('change', draw);
  document.getElementById('avatarInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { loadAvatar(reader.result); };
    reader.readAsDataURL(f);
  });
  draftEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addMessage(); }
  });

  // ---- Arranque ----
  loadAvatar(DEFAULT_AVATAR);
  draw();
})();
</script>
</body>
</html>
