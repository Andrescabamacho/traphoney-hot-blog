<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador de conversaciones</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e7e7e7;
    padding: 16px;
  }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  p.sub { color: #9aa0a6; margin: 0 0 18px; font-size: 14px; }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 24px; }
  @media (min-width: 900px) { .grid { display: grid; grid-template-columns: 1fr 480px; gap: 28px; align-items: start; } }
  .card { background: #1a1d23; border: 1px solid #2a2e36; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .sides { display: flex; gap: 8px; margin-bottom: 12px; }
  .sides button { flex: 1; padding: 10px; border-radius: 10px; border: 0; cursor: pointer; font-size: 14px; font-weight: 600; background: #2a2e36; color: #cfd2d6; }
  .sides button.active { background: #e7e7e7; color: #15171c; }
  textarea { width: 100%; resize: vertical; border-radius: 10px; border: 1px solid #3a3f48; background: #0f1115; color: #fff; padding: 10px; font-size: 14px; font-family: inherit; }
  .btn { width: 100%; padding: 11px; border: 0; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; }
  .btn-add { background: #4f7cff; color: #fff; margin-top: 8px; }
  .btn-dl { background: #19a974; color: #fff; }
  label.opt { display: block; font-size: 13px; color: #cfd2d6; margin-bottom: 10px; }
  input[type=file] { font-size: 12px; color: #cfd2d6; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.msg { display: flex; gap: 8px; align-items: flex-start; background: #0f1115; border: 1px solid #2a2e36; border-radius: 10px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
  .tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
  .tag.l { background: #3a3f48; color: #fff; }
  .tag.r { background: #f0e2c0; color: #5b4a16; }
  .msg .txt { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .msg button { background: none; border: 0; color: #9aa0a6; cursor: pointer; font-size: 14px; padding: 0 4px; }
  .msg button:disabled { opacity: .3; cursor: default; }
  .preview-box { border-radius: 16px; overflow: hidden; }
  canvas { display: block; width: 100%; }
  .hint { text-align: center; font-size: 12px; color: #9aa0a6; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Simulador de conversaciones</h1>
    <p class="sub">Elige quién habla, escribe el mensaje y descarga la conversación con estilo DM de Instagram.</p>
  </div>
  <div class="grid">
    <div>
      <div class="card">
        <div class="sides">
          <button id="sideLeft" class="active" onclick="setSide('left')">⬅️ Izquierda (con foto)</button>
          <button id="sideRight" onclick="setSide('right')">Derecha (tú) ➡️</button>
        </div>
        <textarea id="draft" rows="3" placeholder="Escribe el mensaje…  (Enter = salto de línea, Ctrl/Cmd+Enter = añadir)"></textarea>
        <button class="btn btn-add" onclick="addMessage()">+ Añadir mensaje</button>
      </div>
      <div class="card">
        <label class="opt">Foto de perfil (lado izquierdo)<br><input type="file" accept="image/*" onchange="onAvatar(event)" /></label>
        <label class="opt"><input type="checkbox" id="transparent" onchange="draw()" /> Fondo transparente (en vez de negro)</label>
      </div>
      <div class="card">
        <strong style="font-size:14px;">Mensajes</strong>
        <ul id="list" style="margin-top:10px;"></ul>
      </div>
    </div>
    <div>
      <div class="preview-box" id="previewBox" style="background:#000;">
        <canvas id="canvas"></canvas>
      </div>
      <button class="btn btn-dl" style="margin-top:14px;" onclick="download()">⬇️ Descargar imagen (PNG)</button>
      <p class="hint">Se descarga exactamente lo que ves arriba.</p>
    </div>
  </div>
</div>

<script>
const DEFAULT_AVATAR = "__AVATAR__";

const W = 600, SCALE = 2, SIDE_PAD = 16, TOP_PAD = 22, BOTTOM_PAD = 22;
const PAD_X = 15, PAD_Y = 11, RADIUS = 22, FONT_SIZE = 17, LINE_HEIGHT = 23;
const AVATAR = 30, AVATAR_GAP = 9, GAP_NORMAL = 12, GAP_SAME = 3;
const FONT = '17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const COLORS = { bg:'#000000', rightBubble:'#ece4d9', rightText:'#1c1c1e', leftBubble:'#262628', leftText:'#ffffff', avatarFallback:'#3a3a3c' };

let messages = [
  { id:'a', side:'right', text:'Es malo sobre pensar?' },
  { id:'b', side:'left', text:'Si, cuando no filtras tus pensamientos.\n\nPero si aprendes a usar tu mente, la convertirás en tu superpoder.' },
  { id:'c', side:'right', text:'Mi superpoder?' },
  { id:'d', side:'left', text:'Claro.\nComo cuando descubres la página de trucos del GTA' },
];
let side = 'left';
let avatarImg = null;

function loadAvatar(src){ const img = new Image(); img.onload = () => { avatarImg = img; draw(); }; img.src = src; }
loadAvatar(DEFAULT_AVATAR);

function setSide(s){ side = s; document.getElementById('sideLeft').classList.toggle('active', s==='left'); document.getElementById('sideRight').classList.toggle('active', s==='right'); }

function wrapText(ctx, text, maxWidth){
  const lines = [];
  for (const para of text.split('\n')){
    if (para === ''){ lines.push(''); continue; }
    const words = para.split(' '); let cur = '';
    for (const w of words){ const t = cur ? cur+' '+w : w; if (ctx.measureText(t).width > maxWidth && cur){ lines.push(cur); cur = w; } else { cur = t; } }
    lines.push(cur);
  }
  return lines;
}
function roundRect(ctx,x,y,w,h,r){ r = Math.min(r,h/2,w/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function draw(){
  const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d');
  const transparent = document.getElementById('transparent').checked;
  document.getElementById('previewBox').style.background = transparent ? 'repeating-conic-gradient(#e5e5e5 0% 25%, #ffffff 0% 50%) 50% / 20px 20px' : '#000';
  ctx.font = FONT; ctx.textBaseline = 'top';
  const maxBubble = W*0.74, maxTextWidth = maxBubble - PAD_X*2, leftIndent = SIDE_PAD + AVATAR + AVATAR_GAP;
  const laid = messages.map((msg,i)=>{ const lines = wrapText(ctx,msg.text,maxTextWidth); let tw=0; for(const l of lines) tw=Math.max(tw,ctx.measureText(l).width); const bw=Math.ceil(Math.min(maxBubble,tw+PAD_X*2)); const bh=lines.length*LINE_HEIGHT+PAD_Y*2; const next=messages[i+1]; return {msg,lines,bw,bh,lastOfGroup:!next||next.side!==msg.side}; });
  let totalH = TOP_PAD+BOTTOM_PAD;
  laid.forEach((l,i)=>{ totalH+=l.bh; if(i<laid.length-1) totalH += laid[i+1].msg.side===l.msg.side?GAP_SAME:GAP_NORMAL; });
  totalH = Math.max(totalH,200);
  canvas.width = W*SCALE; canvas.height = Math.ceil(totalH)*SCALE;
  ctx.scale(SCALE,SCALE); ctx.font = FONT; ctx.textBaseline='top';
  if(!transparent){ ctx.fillStyle=COLORS.bg; ctx.fillRect(0,0,W,totalH); } else { ctx.clearRect(0,0,W,totalH); }
  let y = TOP_PAD;
  laid.forEach((l,i)=>{
    const isLeft = l.msg.side==='left'; const x = isLeft ? leftIndent : W-SIDE_PAD-l.bw;
    ctx.fillStyle = isLeft?COLORS.leftBubble:COLORS.rightBubble; roundRect(ctx,x,y,l.bw,l.bh,RADIUS); ctx.fill();
    ctx.fillStyle = isLeft?COLORS.leftText:COLORS.rightText;
    l.lines.forEach((line,li)=> ctx.fillText(line, x+PAD_X, y+PAD_Y+li*LINE_HEIGHT+(LINE_HEIGHT-FONT_SIZE)/2));
    if(isLeft && l.lastOfGroup){
      const ay = y+l.bh-AVATAR; ctx.save(); ctx.beginPath(); ctx.arc(SIDE_PAD+AVATAR/2, ay+AVATAR/2, AVATAR/2, 0, Math.PI*2); ctx.closePath(); ctx.clip();
      if(avatarImg){ const r=Math.max(AVATAR/avatarImg.width,AVATAR/avatarImg.height); const dw=avatarImg.width*r, dh=avatarImg.height*r; ctx.drawImage(avatarImg, SIDE_PAD+AVATAR/2-dw/2, ay+AVATAR/2-dh/2, dw, dh); }
      else { ctx.fillStyle=COLORS.avatarFallback; ctx.fillRect(SIDE_PAD,ay,AVATAR,AVATAR); }
      ctx.restore();
    }
    y += l.bh; if(i<laid.length-1) y += laid[i+1].msg.side===l.msg.side?GAP_SAME:GAP_NORMAL;
  });
  renderList();
}

function renderList(){
  const ul = document.getElementById('list'); ul.innerHTML='';
  messages.forEach((m,i)=>{
    const li = document.createElement('li'); li.className='msg';
    li.innerHTML = `<span class="tag ${m.side==='left'?'l':'r'}">${m.side==='left'?'Izq':'Der'}</span>`+
      `<span class="txt"></span>`+
      `<span style="display:flex;gap:2px;flex-shrink:0;">`+
      `<button ${i===0?'disabled':''} onclick="move('${m.id}',-1)">↑</button>`+
      `<button ${i===messages.length-1?'disabled':''} onclick="move('${m.id}',1)">↓</button>`+
      `<button style="color:#ff6b6b" onclick="remove('${m.id}')">✕</button></span>`;
    li.querySelector('.txt').textContent = m.text;
    ul.appendChild(li);
  });
}

function addMessage(){ const ta=document.getElementById('draft'); const t=ta.value.trim(); if(!t) return; messages.push({id:String(Math.random()),side,text:t}); ta.value=''; draw(); }
function remove(id){ messages = messages.filter(m=>m.id!==id); draw(); }
function move(id,dir){ const i=messages.findIndex(m=>m.id===id); const j=i+dir; if(j<0||j>=messages.length) return; [messages[i],messages[j]]=[messages[j],messages[i]]; draw(); }
function onAvatar(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>loadAvatar(r.result); r.readAsDataURL(f); }
function download(){ const c=document.getElementById('canvas'); const a=document.createElement('a'); a.download='conversacion-'+Date.now()+'.png'; a.href=c.toDataURL('image/png'); a.click(); }

document.getElementById('draft').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); addMessage(); } });
draw();
</script>
</body>
</html>
