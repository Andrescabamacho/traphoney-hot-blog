<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Simulador de conversaciones</title>
<style>
  :root {
    --bg: #0a0a0b;
    --card: #141416;
    --card-2: #1c1c1f;
    --line: rgba(255, 255, 255, 0.07);
    --text: #f2f2f3;
    --muted: #8b9098;
    --accent: #4f6bff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .logo { height: 86px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 12px; }
  .logo img { width: 150px; height: 150px; object-fit: contain; opacity: 0.95; }

  header h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
  }
  .card-head { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.01em; }

  /* selector de lado */
  .sides { display: flex; gap: 6px; background: var(--card-2); padding: 5px; border-radius: 13px; margin-bottom: 12px; }
  .sides button {
    flex: 1; padding: 11px 8px; border: 0; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 600; background: transparent; color: var(--muted);
    transition: all .15s ease; -webkit-appearance: none;
  }
  .sides button.active { background: #ffffff; color: #0a0a0b; box-shadow: 0 1px 4px rgba(0,0,0,.3); }

  textarea {
    width: 100%; resize: vertical; min-height: 84px;
    border-radius: 13px; border: 1px solid var(--line); background: var(--card-2);
    color: var(--text); padding: 13px; font-size: 16px; font-family: inherit; line-height: 1.4;
  }
  textarea::placeholder { color: #5f636b; }
  textarea:focus { outline: none; border-color: var(--accent); }

  .btn {
    width: 100%; padding: 14px; border: 0; border-radius: 13px; cursor: pointer;
    font-size: 15px; font-weight: 700; -webkit-appearance: none; transition: transform .05s ease, filter .15s ease;
  }
  .btn:active { transform: scale(0.99); }
  .btn-primary { background: var(--accent); color: #fff; margin-top: 12px; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-download { background: #ffffff; color: #0a0a0b; }
  .btn-download:hover { filter: brightness(0.94); }

  /* foto */
  .file { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: var(--muted); }
  .file input[type=file] { font-size: 12px; color: var(--muted); }
  .file input::file-selector-button {
    margin-right: 10px; border: 0; border-radius: 9px; padding: 8px 12px;
    background: var(--card-2); color: var(--text); font-weight: 600; cursor: pointer;
  }

  /* preview */
  .preview-box { border-radius: 20px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  canvas { display: block; width: 100%; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  /* lista mensajes */
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li.msg { display: flex; gap: 10px; align-items: flex-start; background: var(--card-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  .tag { flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: .02em; }
  .tag.l { background: #2f3033; color: #fff; }
  .tag.r { background: #dfd6d1; color: #5b4a16; }
  .msg .txt { flex: 1; white-space: pre-wrap; word-break: break-word; line-height: 1.4; color: #d8dade; }
  .msg .ctrls { display: flex; gap: 1px; flex-shrink: 0; }
  .msg .ctrls button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1; padding: 2px 6px; border-radius: 7px; }
  .msg .ctrls button:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .msg .ctrls button:disabled { opacity: .28; cursor: default; }
  .msg .ctrls .del { color: #ff6b6b; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>

  function wrapText(c, text, maxWidth) {
    var lines = [];
    var paras = text.split('\n');
    for (var pi = 0; pi < paras.length; pi++) {
      var para = paras[pi];
      if (para === '') { lines.push(''); continue; }
      var words = para.split(' ');
      var cur = '';
      for (var wi = 0; wi < words.length; wi++) {
        var word = words[wi];
        // Palabra mas larga que la burbuja: partir caracter a caracter
        if (c.measureText(word).width > maxWidth) {
          if (cur) { lines.push(cur); cur = ''; }
          var chunk = '';
          for (var ci = 0; ci < word.length; ci++) {
            var test = chunk + word[ci];
            if (c.measureText(test).width > maxWidth && chunk) { lines.push(chunk); chunk = word[ci]; }
            else { chunk = test; }
          }
          cur = chunk;
          continue;
        }
        var t = cur ? cur + ' ' + word : word;
        if (c.measureText(t).width > maxWidth && cur) { lines.push(cur); cur = word; }
        else { cur = t; }
      }
      lines.push(cur);
    }
    return lines;
  }

    c.arcTo(x + w, y + h, x, y + h, r);

      for (var li = 0; li < lines.length; li++) tw = Math.max(tw, ctx.measureText(lines[li]).width);
      var bw = Math.ceil(Math.min(maxBubble, tw + PAD_X * 2));
      var bh = lines.length * LINE_HEIGHT + PAD_Y * 2;
      var next = messages[i + 1];
      return { msg: msg, lines: lines, bw: bw, bh: bh, lastOfGroup: !next || next.side !== msg.side };
    });

    var totalH = TOP_PAD + BOTTOM_PAD;
    laid.forEach(function (l, i) {
      totalH += l.bh;
      if (i < laid.length - 1) totalH += laid[i + 1].msg.side === l.msg.side ? GAP_SAME : GAP_NORMAL;
    });
    totalH = Math.max(totalH, 160);

    canvas.width = W * SCALE;
    canvas.height = Math.ceil(totalH) * SCALE;
    ctx.scale(SCALE, SCALE);
    ctx.font = FONT; ctx.textBaseline = 'middle';

    // Lienzo SIEMPRE transparente: la descarga sale sin fondo.
    ctx.clearRect(0, 0, W, totalH);

    var y = TOP_PAD;
    laid.forEach(function (l, i) {
      var isLeft = l.msg.side === 'left';
      var x = isLeft ? leftIndent : W - SIDE_PAD - l.bw;

      ctx.fillStyle = isLeft ? COLORS.leftBubble : COLORS.rightBubble;
      roundRect(ctx, x, y, l.bw, l.bh, RADIUS);
      ctx.fill();

      ctx.fillStyle = isLeft ? COLORS.leftText : COLORS.rightText;
      l.lines.forEach(function (line, li) {
        // baseline 'middle': centramos cada línea en su franja para simetría vertical
        ctx.fillText(line, x + PAD_X, y + PAD_Y + li * LINE_HEIGHT + LINE_HEIGHT / 2);
      });

      if (isLeft && l.lastOfGroup) {
        var ay = y + l.bh - AVATAR;
        ctx.save();
        ctx.beginPath();
        ctx.arc(SIDE_PAD + AVATAR / 2, ay + AVATAR / 2, AVATAR / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        if (avatarImg) {
          var r = Math.max(AVATAR / avatarImg.width, AVATAR / avatarImg.height);
          var dw = avatarImg.width * r, dh = avatarImg.height * r;
          ctx.drawImage(avatarImg, SIDE_PAD + AVATAR / 2 - dw / 2, ay + AVATAR / 2 - dh / 2, dw, dh);
        } else {
          ctx.fillStyle = COLORS.avatarFallback;
          ctx.fillRect(SIDE_PAD, ay, AVATAR, AVATAR);
        }
        ctx.restore();
      }

      y += l.bh;
      if (i < laid.length - 1) y += laid[i + 1].msg.side === l.msg.side ? GAP_SAME : GAP_NORMAL;
    });

    renderList();
  }

  function renderList() {
    listEl.innerHTML = '';
    if (messages.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'Aún no hay mensajes. Publica el primero arriba.';
      listEl.appendChild(empty);
      return;
    }
    messages.forEach(function (m, i) {
      var li = document.createElement('li');
      li.className = 'msg';

      var tag = document.createElement('span');
      tag.className = 'tag ' + (m.side === 'left' ? 'l' : 'r');
      tag.textContent = m.side === 'left' ? 'Izq' : 'Der';

      var txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = m.text;

      var ctrls = document.createElement('span');
      ctrls.className = 'ctrls';
      var up = document.createElement('button'); up.type = 'button'; up.textContent = '↑'; up.disabled = i === 0;
      var down = document.createElement('button'); down.type = 'button'; down.textContent = '↓'; down.disabled = i === messages.length - 1;
      var del = document.createElement('button'); del.type = 'button'; del.textContent = '✕'; del.className = 'del';
      up.addEventListener('click', function () { move(m.id, -1); });
      down.addEventListener('click', function () { move(m.id, 1); });
      del.addEventListener('click', function () { remove(m.id); });
      ctrls.appendChild(up); ctrls.appendChild(down); ctrls.appendChild(del);

      li.appendChild(tag); li.appendChild(txt); li.appendChild(ctrls);
      listEl.appendChild(li);
    });
  }

  function addMessage() {
    var t = draftEl.value.trim();
    if (!t) return;
    messages.push({ id: newId(), side: side, text: t });
    draftEl.value = '';
    draftEl.focus();
    draw();
  }
  function remove(id) { messages = messages.filter(function (m) { return m.id !== id; }); draw(); }
  function move(id, dir) {
    var i = -1;
    for (var k = 0; k < messages.length; k++) if (messages[k].id === id) { i = k; break; }
    var j = i + dir;
    if (i < 0 || j < 0 || j >= messages.length) return;
    var tmp = messages[i]; messages[i] = messages[j]; messages[j] = tmp;
    draw();
  }

  // ---- Eventos ----
  sideLeftBtn.addEventListener('click', function () { setSide('left'); });
  sideRightBtn.addEventListener('click', function () { setSide('right'); });
  document.getElementById('addBtn').addEventListener('click', addMessage);
  document.getElementById('dlBtn').addEventListener('click', function () {
    var a = document.createElement('a');
    a.download = 'conversacion-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
  document.getElementById('avatarInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { loadAvatar(reader.result); };
    reader.readAsDataURL(f);
  });
  draftEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addMessage(); }
  });

  // ---- Arranque ----
  loadAvatar(DEFAULT_AVATAR);
  draw();
})();
</script>
</body>
</html>
