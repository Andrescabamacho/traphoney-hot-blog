name: Treasury weekly sync

# Sincroniza la tesoreria con Dropea cada semana y guarda el snapshot en el repo.
on:
  schedule:
    # Lunes a las 06:00 UTC (08:00 en España en verano).
    - cron: '0 6 * * 1'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar tesoreria con Dropea
        env:
          DROPEA_API_URL: ${{ secrets.DROPEA_API_URL }}
          DROPEA_TOKEN: ${{ secrets.DROPEA_TOKEN }}
          # Opcionales: descomenta en el script si Dropea usa cabecera propia.
          # DROPEA_AUTH_HEADER: ${{ secrets.DROPEA_AUTH_HEADER }}
          # DROPEA_AUTH_SCHEME: ${{ secrets.DROPEA_AUTH_SCHEME }}
        run: node scripts/sync-treasury.mjs

      - name: Commit del snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/treasury/latest.json data/treasury/history.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la tesoreria."
          else
            git commit -m "chore(treasury): sync semanal $(date -u +%Y-%m-%d)"
            git push
          fi
