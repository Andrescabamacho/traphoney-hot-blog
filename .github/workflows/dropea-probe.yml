name: Dropea probe

# Sonda de descubrimiento del esquema de Dropea. Corre en CI (con salida a internet)
# y vuelca en el log que campos/queries existen. Se dispara al cambiar la sonda.
on:
  push:
    branches: [claude/accounting-dashboard-integration-ij7jgn]
    paths:
      - scripts/dropea-probe.mjs
      - scripts/lib/dropea.mjs
      - .github/workflows/dropea-probe.yml
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probar la API de Dropea
        env:
          DROPEA_TOKEN: ${{ secrets.DROPEA_TOKEN }}
          DROPEA_API_URL: ${{ secrets.DROPEA_API_URL }}
        run: node scripts/dropea-probe.mjs
